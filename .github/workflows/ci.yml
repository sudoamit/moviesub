name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/quant_test?schema=public"
      JWT_SECRET: "ci_jwt_secret_test_key_123456789"
      APP_ENV: "test"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quant_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Push Database Schema
        run: npx prisma db push --schema=./prisma/schema.prisma --skip-generate

      - name: Typecheck Workspace
        run: npx tsc -b packages/config packages/indicators packages/shared packages/trading-engine packages/risk-engine packages/learning-engine packages/backtesting apps/api apps/worker apps/web

      - name: Run Workspace Tests
        run: npm test

      - name: Build Workspace
        run: npm run build
