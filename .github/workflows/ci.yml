name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/quant_test?schema=public"
      JWT_SECRET: "ci_jwt_secret_test_key_123456789"
      APP_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Typecheck Workspace
        run: npx tsc -b packages/config packages/indicators packages/shared packages/trading-engine packages/risk-engine packages/learning-engine packages/backtesting apps/api apps/worker apps/web

      - name: Run Workspace Tests
        run: npm test

      - name: Build Workspace
        run: npm run build
